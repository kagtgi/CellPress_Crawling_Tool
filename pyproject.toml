[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papers-crawler"
version = "2.0.0"
description = "Resumable, license-aware full-text JSON crawler for Cell Press and Nature Portfolio."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["crawler", "cell-press", "nature", "full-text", "open-access"]
dependencies = [
    "requests>=2.32",
    "tenacity>=9.0",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
legacy-browser = [
    "beautifulsoup4>=4.14",
    "playwright>=1.55",
    "playwright-stealth>=2.0",
]
legacy-ui = ["streamlit>=1.45", "pandas>=2.0"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
papers-crawler = "papers_crawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
papers_crawler = ["schemas/*.json", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that call live scholarly APIs"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    "src/papers_crawler/cell",
    "src/papers_crawler/nature",
    "src/papers_crawler/pubmed",
    "src/papers_crawler/ui.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
