[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papers-crawler"
version = "2.1.0"
description = "Resumable, license-aware full-text JSON crawler for Cell Press and Nature Portfolio."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["crawler", "cell-press", "nature", "full-text", "open-access"]
dependencies = [
    "requests>=2.32",
    "tenacity>=9.0",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
# The legacy-browser / legacy-ui extras backed the v1 PDF crawler, which was
# removed in 2.1.0 — v2 fetches licensed full-text JSON only, never PDFs.
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
papers-crawler = "papers_crawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
papers_crawler = ["schemas/*.json", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that call live scholarly APIs"]

[tool.ruff]
line-length = 88
target-version = "py311"
# No excludes: every remaining module is reachable from `papers-crawler`.

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
